# ============================================================
# SOURCES for REVEILLE / DEFILADE
# Plain list you can edit by hand on GitHub
# (open the file -> pencil icon -> change -> Commit changes).
# Lines starting with # are comments and are ignored.
#
# Every source has two tags:
#   desk:   where it usually belongs. One of:
#           Washington | Middle East | Europe & NATO-Russia |
#           Military | Essays | Continental | Back Page
#           (the editor can still move a piece; this is the default,
#            and it's what the no-AI backup issue uses to sort)
#   access: free        - anyone can read it
#           subscribed  - you pay for it or get it via the MWR library
#                         (never counts against the paid cap)
#           paid        - paywalled for you (capped per issue, see below)
# ============================================================

# --- Paid links allowed per issue. Anything over the cap is dropped,
#     free and subscribed links are unlimited.
max_paid_per_issue:
  reveille: 2
  defilade: 2

# --- Link-level access rules. These win over a source's own tag, so a
#     free newsletter that links to a WSJ story is judged by the WSJ link.
#     Match is on the end of the web address (e.g. "wsj.com" also
#     matches "www.wsj.com").
subscribed_domains:
  - monde-diplomatique.fr     # personal subscription
  - newcriterion.com          # personal subscription
  - wsj.com                   # DoD MWR library pass
  - foreignpolicy.com         # DoD MWR library
paid_domains:
  - thedispatch.com
  - politicopro.com           # Politico Pro (Politico.com itself is free)
  - nytimes.com
  - washingtonpost.com
  - ft.com
  - economist.com
  - bloomberg.com
  - theatlantic.com
  - newyorker.com
  - lefigaro.fr
  - lemonde.fr
  - elpais.com
  - andrewsullivan.substack.com
  - graymirror.substack.com
# Paid Substack posts are also caught automatically by their
# "This post is for paid subscribers" wording, whatever the Substack.

# --- Emails: newsletters are kept only if the sender's address
#     contains the `match` fragment. First match wins, so put more
#     specific fragments (e.g. a single Substack) above general ones.
email_senders:
  # Washington
  - {match: punchbowl.news,       name: Punchbowl News,     desk: Washington,           access: free}
  - {match: politico.com,         name: Politico,           desk: Washington,           access: free}
  - {match: thedispatch.com,      name: The Dispatch,       desk: Washington,           access: paid}
  # Middle East
  - {match: fdd.org,              name: FDD,                desk: Middle East,          access: free}
  - {match: amwaj.media,          name: Amwaj.media,        desk: Middle East,          access: free}
  # Essays & magazines
  - {match: foreignaffairs.com,   name: Foreign Affairs,    desk: Essays,               access: free}
  - {match: compactmag.com,       name: Compact,            desk: Essays,               access: free}
  - {match: unherd.com,           name: UnHerd,             desk: Essays,               access: free}
  - {match: city-journal.org,     name: City Journal,       desk: Essays,               access: free}
  - {match: newcriterion.com,     name: The New Criterion,  desk: Essays,               access: subscribed}
  - {match: firstthings.com,      name: First Things,       desk: Essays,               access: free}
  - {match: nybooks.com,          name: NY Review of Books, desk: Essays,               access: free}
  - {match: newleftreview.org,    name: New Left Review,    desk: Essays,               access: free}
  - {match: engelsbergideas.com,  name: Engelsberg Ideas,   desk: Essays,               access: free}
  - {match: pillarcatholic.com,   name: The Pillar,         desk: Back Page,            access: free}
  # Continental (French / Spanish)
  - {match: monde-diplomatique.fr, name: Le Monde diplomatique, desk: Continental,      access: subscribed}
  - {match: eldebate.com,         name: El Debate,          desk: Continental,          access: free}
  - {match: theobjective.com,     name: The Objective,      desk: Continental,          access: free}
  - {match: infobae.com,          name: Infobae,            desk: Continental,          access: free}
  - {match: frontpopulaire.fr,    name: Front Populaire,    desk: Continental,          access: free}
  - {match: causeur.fr,           name: Causeur,            desk: Continental,          access: free}
  - {match: letraslibres.com,     name: Letras Libres,      desk: Continental,          access: free}
  # Substack last: catches every Substack you subscribe to
  - {match: substack.com,         name: "",                 desk: Essays,               access: free}

