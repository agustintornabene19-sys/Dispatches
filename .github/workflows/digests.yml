name: Build digests

on:
  # PRIMARY trigger: cron-job.org calls the workflow_dispatch API Mon–Sat at
  # 04:30 Europe/Berlin (DST handled by cron-job.org) with digest=auto, so the
  # issue lands by ~05:00 German time. API-triggered runs start within seconds.
  #
  # BACKUP trigger: GitHub's own scheduler, which runs 5–7+ hours late on this
  # repo. If the external trigger already published today's issue,
  # build_digest.py sees the file and skips (no duplicate). If the external
  # trigger failed, this still produces a (late) issue.
  schedule:
    - cron: "41 2 * * 1-6"   # Mon–Fri = REVEILLE, Saturday = DEFILADE
  workflow_dispatch:        # external cron (digest=auto) or manual from the Actions tab
    inputs:
      digest:
        description: "Which digest to build (auto = by weekday: Sat DEFILADE, else REVEILLE)"
        type: choice
        options: [auto, reveille, defilade]
        default: auto

permissions:
  contents: write

concurrency:
  group: digests
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decide which digest to build
        id: which
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.digest }}" != "auto" ] && [ -n "${{ inputs.digest }}" ]; then
            echo "type=${{ inputs.digest }}" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%u)" = "6" ]; then
            echo "type=defilade" >> "$GITHUB_OUTPUT"
          else
            echo "type=reveille" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/build_digest.py --type "${{ steps.which.outputs.type }}"

      - name: Commit and publish the issue
        run: |
          git config user.name "Dispatches bot"
          git config user.email "bot@dispatches.local"
          git add -A
          git diff --cached --quiet && echo "Nothing to publish" && exit 0
          git commit -m "${{ steps.which.outputs.type }} $(date -u +%F)"
          git push
